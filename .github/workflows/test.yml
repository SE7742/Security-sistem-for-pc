name: Test PC Security System (Lite Mode)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create config file (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        cp config.example.py config.py
    
    - name: Create config file (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        copy config.example.py config.py
      shell: cmd
    
    - name: Create required directories
      run: |
        python -c "import os; [os.makedirs(d, exist_ok=True) for d in ['known_faces', 'logs', 'temp']]"
    
    - name: Run import tests
      run: |
        python -c "import cv2; print('OpenCV:', cv2.__version__)"
        python -c "import numpy; print('NumPy:', numpy.__version__)"
        python -c "import PIL; print('Pillow:', PIL.__version__)"
        python -c "import requests; print('Requests:', requests.__version__)"
    
    - name: Run module tests
      run: |
        python -c "from face_database import FaceDatabase; print('FaceDatabase OK')"
        python -c "from telegram_notifier import TelegramNotifier; print('TelegramNotifier OK')"
        python -c "from face_detector import FaceDetector; print('FaceDetector OK')"
